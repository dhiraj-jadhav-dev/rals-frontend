
name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure backend URL
        env:
          RALS_API_BASE_URL: ${{ vars.RALS_API_BASE_URL }}
        run: |
          mkdir -p src/assets
          node -e 'const fs = require("node:fs"); fs.writeFileSync("src/assets/runtime-config.js", `window.RALS_API_BASE_URL = ${JSON.stringify(process.env.RALS_API_BASE_URL || "")};\n`);'

      - name: Build Angular
        run: npx ng build --configuration production --base-href /rals-frontend/

      - name: Add GitHub Pages route fallback
        run: cp dist/rals-store/browser/index.html dist/rals-store/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/rals-store/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
